name: CI/CD Pipeline

on:
  push:
    branches:
      - jdbc
  pull_request:
    types:
      - closed

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21' 
          distribution: 'temurin' 

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build JAR
        run: ./gradlew build 

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app
          path: build/libs/*.jar 
